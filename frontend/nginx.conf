server {
    listen 80;
    root /usr/share/nginx/html;
    proxy_connect_timeout 5s;

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:8080;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
